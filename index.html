<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>店舗コード検索</title>
<style>
  :root {
    --bg: #10141c;
    --panel: #1a212c;
    --panel-2: #212a37;
    --border: #2c3646;
    --text: #eef1f6;
    --text-sub: #8d97a8;
    --amber: #ffb648;
    --amber-dim: #4a3a1f;
    --sky: #7dd3fc;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0;
    padding: 0;
    background: var(--bg);
    color: var(--text);
    font-family: "Hiragino Sans", "Noto Sans JP", "Yu Gothic", sans-serif;
    min-height: 100vh;
  }
  .wrap {
    max-width: 480px;
    margin: 0 auto;
    padding: 28px 20px 60px;
  }
  header {
    margin-bottom: 24px;
  }
  header h1 {
    font-size: 20px;
    font-weight: 700;
    margin: 0 0 4px;
    letter-spacing: 0.02em;
  }
  header p {
    font-size: 13px;
    color: var(--text-sub);
    margin: 0;
    line-height: 1.6;
  }
  .input-card {
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 16px;
    padding: 20px;
    margin-bottom: 16px;
  }
  .input-label {
    font-size: 12px;
    color: var(--text-sub);
    margin-bottom: 10px;
    display: block;
  }
  #codeInput {
    width: 100%;
    background: var(--bg);
    border: 1px solid var(--border);
    border-radius: 10px;
    color: var(--amber);
    font-family: "SF Mono", "Menlo", "Consolas", monospace;
    font-size: 30px;
    font-weight: 700;
    letter-spacing: 0.18em;
    text-align: center;
    padding: 16px 8px;
    outline: none;
    transition: border-color 0.15s ease;
  }
  #codeInput:focus {
    border-color: var(--amber);
  }
  #codeInput::placeholder {
    color: #3a4453;
    letter-spacing: 0.1em;
  }
  .dots {
    display: flex;
    justify-content: center;
    gap: 8px;
    margin-top: 14px;
  }
  .dot {
    width: 9px;
    height: 9px;
    border-radius: 50%;
    background: var(--border);
    transition: background 0.12s ease, transform 0.12s ease;
  }
  .dot.filled {
    background: var(--amber);
    transform: scale(1.15);
  }
  .clear-btn {
    display: block;
    margin: 14px auto 0;
    background: none;
    border: none;
    color: var(--text-sub);
    font-size: 13px;
    padding: 6px 10px;
    cursor: pointer;
  }
  .clear-btn:active { color: var(--amber); }

  .result {
    display: none;
  }
  .result.show {
    display: block;
    animation: fadeIn 0.2s ease;
  }
  @keyframes fadeIn {
    from { opacity: 0; transform: translateY(4px); }
    to { opacity: 1; transform: translateY(0); }
  }
  .result-card {
    background: var(--panel);
    border: 1px solid var(--amber);
    border-radius: 16px;
    padding: 22px 20px;
  }
  .result-row {
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    padding: 12px 0;
    border-bottom: 1px solid var(--border);
  }
  .result-row:last-child { border-bottom: none; padding-bottom: 0; }
  .result-row:first-child { padding-top: 0; }
  .result-label {
    font-size: 12px;
    color: var(--text-sub);
    white-space: nowrap;
  }
  .result-value {
    font-size: 17px;
    font-weight: 700;
    text-align: right;
  }
  .result-value.course { color: var(--amber); font-size: 20px; }
  .result-value.order-badge {
    background: var(--amber-dim);
    color: var(--amber);
    font-family: "SF Mono", "Menlo", monospace;
    padding: 3px 12px;
    border-radius: 999px;
    font-size: 15px;
  }
  .result-value.time { color: var(--sky); font-family: "SF Mono", "Menlo", monospace; }

  .not-found {
    display: none;
    background: var(--panel);
    border: 1px solid #4a2a2a;
    border-radius: 16px;
    padding: 24px 20px;
    text-align: center;
    color: #e08a8a;
    font-size: 14px;
  }
  .not-found.show { display: block; }

  .hint {
    text-align: center;
    color: var(--text-sub);
    font-size: 12px;
    margin-top: 16px;
    line-height: 1.7;
  }
  .footer {
    text-align: center;
    color: #4a5568;
    font-size: 11px;
    margin-top: 36px;
  }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>店舗コード検索</h1>
    <p>6桁の店舗コードを入力すると、配送先情報を表示します</p>
  </header>

  <div class="input-card">
    <label class="input-label" for="codeInput">店舗コード</label>
    <input
      id="codeInput"
      type="tel"
      inputmode="numeric"
      pattern="[0-9]*"
      maxlength="6"
      placeholder="------"
      autocomplete="off"
    />
    <div class="dots" id="dots">
      <span class="dot"></span><span class="dot"></span><span class="dot"></span>
      <span class="dot"></span><span class="dot"></span><span class="dot"></span>
    </div>
    <button class="clear-btn" id="clearBtn">クリア</button>
  </div>

  <div class="result" id="result">
    <div class="result-card">
      <div class="result-row">
        <span class="result-label">コース名</span>
        <span class="result-value course" id="rCourse"></span>
      </div>
      <div class="result-row">
        <span class="result-label">路順</span>
        <span class="result-value order-badge" id="rOrder"></span>
      </div>
      <div class="result-row">
        <span class="result-label">店舗名</span>
        <span class="result-value" id="rName"></span>
      </div>
    </div>
  </div>

  <div class="not-found" id="notFound">
    該当する店舗コードが見つかりませんでした。入力内容をご確認ください。
  </div>

  <p class="hint">数字を入力すると自動で検索されます。桁数が揃うまで結果は表示されません。</p>
  <p class="footer">店舗データ 763 件</p>
</div>

  }

  var input = document.getElementById('codeInput');
  var dots = document.querySelectorAll('.dot');
  var result = document.getElementById('result');
  var notFound = document.getElementById('notFound');
  var clearBtn = document.getElementById('clearBtn');

  function updateDots(len) {
    for (var i = 0; i < dots.length; i++) {
      if (i < len) dots[i].classList.add('filled');
      else dots[i].classList.remove('filled');
    }
  }

  function showResult(entry) {
    document.getElementById('rCourse').textContent = entry.course;
    document.getElementById('rOrder').textContent = entry.order + '番目';
    document.getElementById('rName').textContent = entry.name;
    result.classList.add('show');
    notFound.classList.remove('show');
  }

  function hideResults() {
    result.classList.remove('show');
    notFound.classList.remove('show');
  }

  input.addEventListener('input', function (e) {
    var val = e.target.value.replace(/[^0-9]/g, '').slice(0, 6);
    e.target.value = val;
    updateDots(val.length);

    if (val.length === 6) {
      var entry = index[val];
      if (entry) {
        showResult(entry);
      } else {
        result.classList.remove('show');
        notFound.classList.add('show');
      }
    } else {
      hideResults();
    }
  });

  clearBtn.addEventListener('click', function () {
    input.value = '';
    updateDots(0);
    hideResults();
    input.focus();
  });

  input.focus();
