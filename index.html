  var index = {};
  for (var i = 0; i < DATA.length; i++) {
    index[DATA[i].code] = DATA[i];
  }

  var input = document.getElementById('codeInput');
  var dots = document.querySelectorAll('.dot');
  var result = document.getElementById('result');
  var notFound = document.getElementById('notFound');
  var clearBtn = document.getElementById('clearBtn');

  function updateDots(len) {
    for (var i = 0; i < dots.length; i++) {
      if (i < len) dots[i].classList.add('filled');
      else dots[i].classList.remove('filled');
    }
  }

  function showResult(entry) {
    document.getElementById('rCourse').textContent = entry.course;
    document.getElementById('rOrder').textContent = entry.order + '番目';
    document.getElementById('rName').textContent = entry.name;
    result.classList.add('show');
    notFound.classList.remove('show');
  }

  function hideResults() {
    result.classList.remove('show');
    notFound.classList.remove('show');
  }

  input.addEventListener('input', function (e) {
    var val = e.target.value.replace(/[^0-9]/g, '').slice(0, 6);
    e.target.value = val;
    updateDots(val.length);

    if (val.length === 6) {
      var entry = index[val];
      if (entry) {
        showResult(entry);
      } else {
        result.classList.remove('show');
        notFound.classList.add('show');
      }
    } else {
      hideResults();
    }
  });

  clearBtn.addEventListener('click', function () {
    input.value = '';
    updateDots(0);
    hideResults();
    input.focus();
  });

  input.focus();
